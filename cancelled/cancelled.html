<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhosOnNext - Cancelled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Fluorescent0/Weaver-Pool-App-assets/refs/heads/main/WON_favicon.ico">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #09090C;
  --surface:    #111318;
  --border:     rgba(255,255,255,0.06);
  --border-hi:  rgba(255,255,255,0.11);
  --gold:       #D4A441;
  --gold-lt:    #EEC060;
  --text:       #EDE9E0;
  --text-muted: #6B7280;
  --r:    14px;
  --r-sm: 9px;
  font-family: 'Outfit', system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100svh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
}
.icon { width: 44px; height: 44px; margin: 0 auto 18px; color: var(--text-muted); }
.icon svg { width: 100%; height: 100%; }
.card {
  position: relative; z-index: 1;
  background: var(--surface);
  padding: 40px 36px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  max-width: 440px; width: 100%;
}
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(34px, 7vw, 44px);
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 14px;
}
p { margin-bottom: 26px; color: var(--text-muted); line-height: 1.65; font-size: 15px; }
p a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(212,164,65,0.3); }
p a:hover { color: var(--gold-lt); border-color: var(--gold-lt); }
.btn {
  display: inline-block;
  background: linear-gradient(135deg, #B8892B, #D4A441, #EEC060);
  color: #0D0800;
  padding: 13px 28px;
  border-radius: var(--r-sm);
  text-decoration: none;
  font-weight: 700; font-size: 14.5px;
  transition: filter .15s;
}
.btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6"/><path d="M15 9l-6 6"/></svg></div>
    <h1>Payment Cancelled</h1>
    <p>Your payment was not completed. No charges were made to your card. If you experienced an issue, please reach out to us at <a href="mailto:ruairi@whosonnext.uk">contact@whosonnext.uk</a>.</p>
    <a href="/" class="btn">Return Home</a>
  </div>
</body>
</html>
